<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Paciente y Cita - Huellas Sanas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="mb-4 text-center">🐶 Registrar Mascota y Cita</h3>
                <form method="post">
                    {% csrf_token %}
                    <h5 class="text-secondary">Datos de la Mascota</h5>
                    {{ mascota_form.as_p }}
                    <hr class="my-4">
                    <h5 class="text-secondary">Datos de la Cita</h5>
                    {{ cita_form.as_p }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success">Guardar Registro</button>
                        <a href="{% url 'lista_citas' %}" class="btn btn-secondary">Volver al Listado</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
